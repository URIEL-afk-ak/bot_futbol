services:
  - type: web
    name: bot-futbol-backend
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dspring.profiles.active=production -jar target/bot-futbol-1.0.0.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: DATABASE_URL
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: production

# ============================================
# CONFIGURACIÓN PARA DESARROLLO LOCAL
# ============================================

# Base de datos PostgreSQL local (puerto 3001)
spring.datasource.url=jdbc:postgresql://localhost:3001/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=bot_futbol
spring.datasource.password=1913Facultades

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.botfutbol=DEBUG
bot.test-mode=false

# ============================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ============================================
spring.application.name=Bot Futbol

# Puerto del servidor (Render usa la variable de entorno PORT)
server.port=${PORT:8080}

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - H2 (Desarrollo)
# ============================================
# Comentado para usar PostgreSQL en producción
# Descomentar estas líneas para usar H2 en memoria en desarrollo local
#spring.datasource.url=jdbc:h2:mem:botfutbol
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

# Habilitar consola H2 (solo para desarrollo local)
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - PostgreSQL (Producción)
# ============================================
# Configuración para Render con PostgreSQL
# Las variables DB_USERNAME y DB_PASSWORD deben estar configuradas en Render
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-1-us-east-2.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Desactivar prepared statements para compatibilidad con Session Pooler de Supabase
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=0
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=0
# Deshabilitar prepared statements en Hibernate
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
# Dialecto de Hibernate (PostgreSQL para producción)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Para desarrollo local con H2, descomentar:
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia de DDL (crear tablas automáticamente)
# create: Crea las tablas cada vez (elimina datos existentes)
# create-drop: Crea al iniciar, elimina al cerrar
# update: Actualiza el esquema sin eliminar datos
# validate: Solo valida el esquema
# none: No hace nada
spring.jpa.hibernate.ddl-auto=update

# Configuración de schema público de PostgreSQL (solo para PostgreSQL)
#spring.jpa.properties.hibernate.default_schema=public

# Mostrar SQL en consola (desactivado en producción)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Generar estadísticas de Hibernate
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
# Nivel de log general
logging.level.root=INFO

# Nivel de log para el paquete de la aplicación
logging.level.com.botfutbol=DEBUG

# Nivel de log para Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Nivel de log para Spring
logging.level.org.springframework.web=INFO

# Patrón de log en consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN BOT
# ============================================
# Costo por defecto por jugador por partido
bot.default.cost-per-player=1500.0

# Número máximo de jugadores por equipo
bot.team.max-players=11

# Habilitar modo de prueba
bot.test-mode=false

# ============================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# ============================================
# CONFIGURACIÓN DE ERRORES
# ============================================
# Incluir mensaje de error en respuesta
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

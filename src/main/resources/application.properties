# ============================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ============================================
spring.application.name=Bot Futbol

# Puerto del servidor
server.port=8080

# ============================================
# CONFIGURACIÓN DE BASE DE DATOS - PostgreSQL (Supabase/Render)
# ============================================
# Para desarrollo local, usar las propiedades por defecto
# Para producción (Render/Supabase), usar variables de entorno:
# - DATABASE_URL (formato: postgresql://user:pass@host:port/dbname) - Prioridad alta
# - O variables individuales: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

# Configuración por defecto (desarrollo local)
spring.datasource.url=jdbc:postgresql://localhost:3001/postgres
spring.datasource.username=bot_futbol
spring.datasource.password=1913Facultades
spring.datasource.driver-class-name=org.postgresql.Driver

# Si DATABASE_URL está disponible, DatabaseConfig.java lo parseará automáticamente
# Si no, usar variables individuales (para Render con PostgreSQL service)
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
# spring.datasource.username=${DB_USERNAME:bot_futbol}
# spring.datasource.password=${DB_PASSWORD:1913Facultades}

# Configuración del pool de conexiones
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ============================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Estrategia de DDL (actualiza el esquema automáticamente)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURACIÓN DE LOGGING
# ============================================
# Nivel de log general
logging.level.root=INFO

# Nivel de log para la aplicación
logging.level.com.botfutbol=DEBUG

# Nivel de log para Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Nivel de log para Spring
logging.level.org.springframework.web=INFO

# Patrón de log en consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN BOT
# ============================================
# Costo por defecto por jugador por partido
bot.default.cost-per-player=1500.0

# Número máximo de jugadores por equipo
bot.team.max-players=11

# Habilitar modo de prueba
bot.test-mode=false

# ============================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# ============================================
# CONFIGURACIÓN DE ERRORES
# ============================================
# Incluir mensaje de error en respuesta
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# CONFIGURACIÓN DE FIREBASE (NOTIFICACIONES PUSH)
# ============================================
# Ruta al archivo de credenciales de Firebase (para desarrollo local)
firebase.credentials.path=firebase-credentials.json

# O usa variable de entorno FIREBASE_CREDENTIALS_JSON (para producción)
# Ejemplo: FIREBASE_CREDENTIALS_JSON={"type":"service_account","project_id":"..."}

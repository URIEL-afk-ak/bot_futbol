# ============================================
# CONFIGURACIÓN PARA PRODUCCIÓN (Render/Supabase)
# ============================================

# Base de datos - se configura desde DATABASE_URL o variables de entorno
# DatabaseConfig.java parsea DATABASE_URL automáticamente

# Logging - menos verboso en producción
logging.level.root=INFO
logging.level.com.botfutbol=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO

# JPA - no mostrar SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones optimizado para producción
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Puerto del servidor - Render lo asigna automáticamente
server.port=${PORT:8080}

